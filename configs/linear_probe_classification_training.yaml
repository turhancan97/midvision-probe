system:
  random_seed: 8
  num_gpus: 1
  port: 12366
note: ""
batch_size: 256
wandb:
  use: False
defaults:
  - optimizer: ten_epoch
  - backbone: dino_b16
  - dataset: imagenette
  - probe: classifier
  - _self_
experiment_name: SSL_Linear_Classification
experiment_model: dino_b16
is_eval: False
ckpt_path: ""
output_dir: "result"
# Ensure CLS token or mean pool is True in the backbone
backbone:
  return_cls: false
  mean_pool: true
  efficient_probe: false
probe:
  dropout_rate: 0.0
  use_layernorm: true
  num_classes: 102 # 10 for Imagenette, 100 for FGVCAircraft, 102 for Flowers102